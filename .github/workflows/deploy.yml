name: Build and Deploy Docker Image

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: echo "${{ secrets.WEB_ENV_FILE }}" > ./web-client/.env

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/vanchuongmandam-web-client:latest

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Create .env file from secret
            echo "${{ secrets.WEB_ENV_FILE }}" > ${{ secrets.VPS_WORKDIR }}/web-client/.env
            
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/vanchuongmandam-web-client:latest
            
            # Stop and remove the old container if it exists
            if [ "$(docker ps -a -q -f name=web-client)" ]; then
                docker stop web-client
                docker rm web-client
            fi

            # Run the new container with env file
            docker run -d \
              --name web-client \
              --restart unless-stopped \
              --env-file ${{ secrets.VPS_WORKDIR }}/web-client/.env \
              -p 3000:3000 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/vanchuongmandam-web-client:latest
