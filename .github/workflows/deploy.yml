name: CD – Build & Deploy

on:
  push:
    branches: [deploy]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vcmd-web-client
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vcmd-web-client:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/vcmd-web-client:latest
          cache-from: type=gha,scope=web-client
          cache-to: type=gha,mode=max,scope=web-client
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://media.vanchuongmandam.com/api
            NEXT_PUBLIC_API_URL=https://media.vanchuongmandam.com
            DOCKER_BUILD=true

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: [self-hosted, linux]
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull & restart web-client
        run: |
          set -e
          docker pull ghcr.io/${{ github.repository_owner }}/vcmd-web-client:latest
          docker stop web-client || true
          docker rm web-client || true

          # Find .env file in workspace or runner folder
          ENV_FILE=".env"
          if [ ! -f "$ENV_FILE" ]; then
            if [ -f "/opt/actions-runner-web/.env" ]; then
              ENV_FILE="/opt/actions-runner-web/.env"
            elif [ -f "/var/www/web-client/.env" ]; then
              ENV_FILE="/var/www/web-client/.env"
            elif [ -f "../../.env" ]; then
              ENV_FILE="../../.env"
            else
              echo "❌ Error: .env file not found!"
              exit 1
            fi
          fi
          echo "Using env file: $ENV_FILE"

          docker run -d \
            --name web-client \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -e HOSTNAME=0.0.0.0 \
            -p 3000:3000 \
            ghcr.io/${{ github.repository_owner }}/vcmd-web-client:latest
          docker image prune -f
          echo "✅ Deployed web-client:${{ needs.build.outputs.image_tag }}"
